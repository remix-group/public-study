services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dian
      POSTGRES_PASSWORD: dian
      POSTGRES_DB: dian_study
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dian -d dian_study"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dian_postgres_data:/var/lib/postgresql/data

volumes:
  dian_postgres_data:
