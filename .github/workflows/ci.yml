name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: dian
          POSTGRES_PASSWORD: dian
          POSTGRES_DB: dian_study
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dian -d dian_study"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dian:dian@localhost:5432/dian_study?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dian-study/infrastructure db:generate
      - run: pnpm --filter @dian-study/infrastructure db:migrate:deploy
      - run: pnpm --filter @dian-study/infrastructure db:seed
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
